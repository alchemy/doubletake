name: CI

on:
  push:
    branches: [main, "integration/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build architecture archive
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: bash scripts/build-release.sh "$RELEASE_VERSION" "$RELEASE_ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true

      - name: Extract release notes from tag
        id: notes
        run: |
          # Re-fetch the tag to ensure the annotated tag object is present
          git fetch origin tag "${GITHUB_REF_NAME}" --force --no-tags
          NOTES=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")
          if [ -z "$NOTES" ]; then
            NOTES=$(git log -1 --format='%B' "${GITHUB_REF_NAME}")
          fi
          {
            echo 'RELEASE_NOTES<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.RELEASE_NOTES }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
