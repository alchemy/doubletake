<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.doubletake.Network1"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.doubletake.Network1"/>
    <allow send_destination="org.doubletake.Network1"
           send_interface="org.doubletake.Network1" send_member="Begin"
           send_type="method_call" min_fds="4" max_fds="4"/>
    <allow send_destination="org.doubletake.Network1"
           send_interface="org.doubletake.Network1" send_member="Alive"
           send_type="method_call" max_fds="0"/>
    <allow send_destination="org.doubletake.Network1"
           send_interface="org.doubletake.Network1" send_member="End"
           send_type="method_call" max_fds="0"/>
  </policy>
</busconfig>
